name: spec-drift

# This workflow is the repo's own claim, executed:
# "specs should stay consistent" should not be a wish — it should be a check that goes red.
#
# Job 1 (selfcheck): the tool must fire on a known-bad fixture and stay silent on a clean one.
#                    A checker nobody tests is a checker nobody can trust.
# Job 2 (gate):      prove the --fail-on gate actually blocks. It must exit 1 on demo/ and
#                    exit 0 on clean/. If the gate ever becomes a no-op, this job fails.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    name: Self-check · 工具自检（缺陷样例必须报警，干净样例必须沉默）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: demo/ must report 8 findings
        run: python spec_drift.py --root demo
      - name: clean/ must report 0 findings
        run: python spec_drift.py --root clean
      - name: assertion suite (14 assertions, both directions)
        run: python selfcheck.py

  gate:
    name: Drift gate · 门禁必须真的会红（不能是空的）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 1) The gate must FAIL on a fixture that genuinely has lost test anchors.
      - name: demo/ must FAIL the D3 gate (expect exit 1)
        run: |
          set +e
          python spec_drift.py --root demo --fail-on D3
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::gate did not fire on a fixture that must fail (exit $code)"
            exit 1
          fi
          echo "gate fired correctly: exit 1"
      # 2) The gate must PASS on a fixture where every FR is anchored.
      - name: clean/ must PASS the D3 gate (expect exit 0)
        run: python spec_drift.py --root clean --fail-on D3
